worker_processes  1;

error_log  D:/file/aidemo/bible/.runtime/nginx/error.log warn;
pid        D:/file/aidemo/bible/.runtime/nginx/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       D:/dev/nginx-1.20.2/conf/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" $request_time';
    access_log  D:/file/aidemo/bible/.runtime/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
    gzip_vary on;

    upstream bible_api {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen       8088;
        server_name  127.0.0.1 localhost;
        root         D:/file/aidemo/bible/frontend/dist;
        index        index.html;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;

        location /api/ {
            proxy_pass         http://bible_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
